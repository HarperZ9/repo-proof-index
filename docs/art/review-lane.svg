<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a review summary: rows, kinds, statuses, gaps, nine, reason, eight, and summary. The rows are every artifact already indexed, in path order. Kinds are counted and sorted by name, so the mix of artifact types is visible at a glance. Statuses are counted the same way. An evidence gap is decided by a string test on the evidence line: empty, the word unknown, or any text beginning with the word no. Nine status values put a row on the action list, among them blocked, draft, drift, fail, planned, unknown, and unverified. The constant status a backend descriptor carries is not among them, so a backend matrix never lands on the list by status alone. Each item names a reason, either to add evidence or to resolve the status it carries, alongside the path that holds it. The list stops at eight items and does not say how many were left out. The summary carries five fields and prints as text or as JSON. Three outcomes: clear, action, and truncated."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">WHAT STILL NEEDS WORK</text><text class="h" x="44" y="72">How a stack of rows turns into a short list of things to fix</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H367.75V213"/><text class="k" x="592.25" y="245" text-anchor="middle" fill="var(--drift)">A GAP IS A STRING TEST, NOT A LOOKUP</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">A BACKEND MATRIX NEEDS NO ACTION</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Rows</text><text class="s" x="58" y="168">Every artifact indexed, in</text><text class="s" x="58" y="183">path order.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Kinds</text><text class="s" x="282.5" y="168">Counted and sorted, so the mix</text><text class="s" x="282.5" y="183">is visible.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Statuses</text><text class="s" x="507" y="168">Counted the same way, sorted</text><text class="s" x="507" y="183">by name.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Gaps</text><text class="s" x="731.5" y="168">Evidence missing, unknown, or</text><text class="s" x="731.5" y="183">starting with no.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Nine</text><text class="s" x="58" y="360">Nine status values put a row</text><text class="s" x="58" y="375">on the list.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Reason</text><text class="s" x="282.5" y="360">Add evidence, or resolve the</text><text class="s" x="282.5" y="375">status named.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Eight</text><text class="s" x="507" y="360">The list stops at eight and</text><text class="s" x="507" y="375">says nothing more.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Summary</text><text class="s" x="731.5" y="360">Five fields, printed as text</text><text class="s" x="731.5" y="375">or as JSON.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">CLEAR</text><text class="s" x="58" y="509" font-size="10.5">no gaps, and no status on the list</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">ACTION</text><text class="s" x="357.33" y="509" font-size="10.5">a status to resolve, or evidence to add</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">TRUNCATED</text><text class="s" x="656.67" y="509" font-size="10.5">more than eight rows want attention</text><text class="s" x="44" y="546">A short list gets acted on and a long one gets ignored, so the action list stops at eight. The gap count above it is not capped, which is how you tell whether the list you are reading is the whole list.</text></svg>
